[package]
name = "cad-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tcad-desktop"
path = "src/main.rs"

[dependencies]
cad-core.workspace = true
serde.workspace = true
serde_json.workspace = true
bevy = { version = "=0.20.0", default-features = false, features = ["3d", "default_platform", "default_font", "png", "multi_threaded"] }
bevy_egui = { version = "=0.43.1", features = ["accesskit"] }
winit = { version = "=0.30.13", default-features = false }
rfd = "0.17"
