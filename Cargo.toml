[workspace]
resolver = "3"
members = ["crates/cad-core", "crates/cad-kernel", "crates/cad-worker", "crates/cad-cli", "crates/cad-desktop"]
default-members = ["crates/cad-desktop", "crates/cad-worker", "crates/cad-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "WTFPL"
rust-version = "1.99"

[workspace.dependencies]
cad-core = { path = "crates/cad-core" }
cad-kernel = { path = "crates/cad-kernel" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
nalgebra = { version = "0.34", features = ["serde-serialize"] }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
